      (function() {
        try {
          let _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return _currentFetch;
            },
            set(newFetch) {
              _currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // ignore
        }
      })();
